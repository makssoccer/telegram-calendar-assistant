services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?Set OWNER_TELEGRAM_ID in .env}
      USER_TIMEZONE: ${USER_TIMEZONE:-Europe/Minsk}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_TOKEN_PATH: /app/secrets/google-token.json
      WHISPER_CACHE: /home/bot/models
      HF_HUB_DISABLE_TELEMETRY: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./secrets:/app/secrets
      - whisper_models:/home/bot/models
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  whisper_models:
  postgres_data:
